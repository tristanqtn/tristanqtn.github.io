<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script>
  // Inline and render-blocking on purpose: this has to run before the first
  // paint, or a reader with the non-default theme gets a flash of the wrong one.
  try {
    var t = localStorage.getItem('theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) { /* private mode, storage disabled — fall back to system */ }
</script>
